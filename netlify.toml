[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/spotify/now-playing"
  to = "/.netlify/functions/spotify-now-playing"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
